name: ci

# IptvGuide fork: builds only the macOS universal video xcframeworks that
# media_kit_libs_macos_video consumes (default flavor + the closed-caption
# decoder + patches/ffmpeg-ccaption-default-first-field.patch). A tag
# publishes it as a release asset.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  macos:
    runs-on: macos-14
    timeout-minutes: 300
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install requirements
        run: brew install go meson ninja nasm

      - name: Print tool versions
        run: make tool-versions || true

      - name: Determine version
        id: version
        run: |
          case "${GITHUB_REF}" in
          refs/tags/*) VERSION=${GITHUB_REF#refs/tags/} ;;
          *) VERSION=develop ;;
          esac
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Build
        run: |
          VERSION=${{ steps.version.outputs.version }}
          make build/output/libmpv-xcframeworks_${VERSION}_macos-universal-video-default.tar.gz
          shasum -a 256 build/output/*.tar.gz

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          if-no-files-found: error
          path: build/output/*.tar.gz

      - name: Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          fail_on_unmatched_files: true
          files: build/output/*.tar.gz
